[package]
name = "simq"
version = "0.4.0"
edition = "2021"
description = "SimQ – a queue and tracker for simulation requests in a Formula Student team"
license = "MIT"

[lib]
name = "simq"
path = "src/lib.rs"

[[bin]]
name = "simq"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui_extras = "0.31"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
directories = "5"
rfd = "0.15"
thiserror = "1"
anyhow = "1"
ureq = "2"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
