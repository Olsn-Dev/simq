name: Release

# Builds release binaries when a tag starting with "v" is pushed, e.g. v0.1.0.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/SimQ | Out-Null
          Copy-Item target/release/simq.exe dist/SimQ/SimQ.exe
          Copy-Item README.md dist/SimQ/
          Compress-Archive -Path dist/SimQ -DestinationPath "simq-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=dist/SimQ.app
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp assets/SimQ.icns "$APP/Contents/Resources/SimQ.icns"
          cp target/release/simq "$APP/Contents/MacOS/simq"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SimQ</string>
            <key>CFBundleDisplayName</key><string>SimQ</string>
            <key>CFBundleIdentifier</key><string>se.simq.SimQ</string>
            <key>CFBundleExecutable</key><string>simq</string>
            <key>CFBundleIconFile</key><string>SimQ</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad hoc signing (no developer licence): required for the app to start on Apple Silicon.
          codesign --force --deep --sign - "$APP"
          # Disk image with the app and a shortcut to Applications, so it can be dragged there.
          mkdir dmg
          cp -R "$APP" dmg/
          cp README.md dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "SimQ" -srcfolder dmg -ov -format UDZO \
            "simq-${GITHUB_REF_NAME}-${{ matrix.name }}.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/simq
          cp target/release/simq README.md dist/simq/
          tar -czf "simq-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz" -C dist simq

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            simq-*.zip
            simq-*.tar.gz
            simq-*.dmg
