name: Release

# Builds release files when a tag starting with "v" is pushed, e.g. v0.1.0.
# The tag must match the version in Cargo.toml, which is the single source of
# truth for the version of every file built here.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux-x64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS builds for both Apple Silicon and Intel.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: The tag matches Cargo.toml
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match version $VERSION in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Tests
        run: cargo test --locked

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      # ---------------------------------------------------------------- Windows

      # Windows gets only the portable program: no installer. It runs on a
      # double-click, and is what the in-app update downloads.
      - name: Portable program (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/release/simq.exe simq-windows-x64.exe

      # ------------------------------------------------------------------ macOS

      - name: Build (macOS, Apple Silicon and Intel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          # The bare programs, used by the in-app update.
          cp target/aarch64-apple-darwin/release/simq simq-macos-arm64
          cp target/x86_64-apple-darwin/release/simq simq-macos-x64
          # One program for both kinds of Mac, inside the app in the disk image.
          lipo -create -output simq-universal simq-macos-arm64 simq-macos-x64

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=dist/SimQ.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp assets/SimQ.icns "$APP/Contents/Resources/SimQ.icns"
          cp simq-universal "$APP/Contents/MacOS/simq"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SimQ</string>
            <key>CFBundleDisplayName</key><string>SimQ</string>
            <key>CFBundleIdentifier</key><string>se.simq.SimQ</string>
            <key>CFBundleExecutable</key><string>simq</string>
            <key>CFBundleIconFile</key><string>SimQ</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad hoc signing (no developer licence): required for the app to start on Apple Silicon.
          codesign --force --deep --sign - "$APP"
          # Disk image with the app and a shortcut to Applications, so it can be dragged there.
          mkdir dmg
          cp -R "$APP" dmg/
          cp README.md dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "SimQ" -srcfolder dmg -ov -format UDZO \
            "simq-${GITHUB_REF_NAME}-macos.dmg"

      # ------------------------------------------------------------------ Linux

      - name: Install cargo-deb (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          # The bare program, used by the in-app update.
          cp target/release/simq simq-linux-x64
          # Debian and Ubuntu package, from [package.metadata.deb] in Cargo.toml.
          cargo deb --no-build --no-strip --output "simq-${GITHUB_REF_NAME}-linux-x64.deb"
          # AppImage: one file that runs on most distributions. Its in-app
          # update downloads simq-linux-x64.AppImage.
          APPDIR=dist/SimQ.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp target/release/simq "$APPDIR/usr/bin/simq"
          cp assets/linux/simq.desktop "$APPDIR/simq.desktop"
          cp assets/icon-256.png "$APPDIR/simq.png"
          ln -s usr/bin/simq "$APPDIR/AppRun"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$APPDIR" simq-linux-x64.AppImage
          cp simq-linux-x64.AppImage "simq-${GITHUB_REF_NAME}-linux-x64.AppImage"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Lists the changes since the previous version on the release page.
          generate_release_notes: true
          files: |
            simq-*.dmg
            simq-*.deb
            simq-*.AppImage
            simq-windows-x64.exe
            simq-macos-arm64
            simq-macos-x64
            simq-linux-x64
